name: Publish to npm

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/bun-setup

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5.1 or newer. Node 24 ships close
      # enough that this looks redundant, and it is exactly the kind of
      # redundancy worth keeping: when it is wrong, the failure is an auth
      # error at the publish step, after the release tag already exists.
      - name: Use an npm that can do OIDC
        run: npm install -g npm@latest

      # One script rather than three `npm version` calls plus a sed, because
      # `rsc-kit` pins the other two. Miss that and the CLI ships depending on
      # an engine version that does not exist — it installs for nobody and
      # builds fine for us.
      - name: Set version from release tag
        run: node scripts/versions.mjs "${GITHUB_REF_NAME#v}"

      - name: Build
        run: bun run --filter "*" build

      # The one check worth repeating here. CI already ran it on main, but it
      # is the only thing that can see the difference between the repo and the
      # tarball, and the cost of finding out afterwards is a burnt version.
      - name: Verify the published shape
        run: bun run verify:package

      # Staged, not published. `npm stage publish` uploads the tarball and
      # makes nothing live: a human approves it afterwards with 2FA, and that
      # is what reaches the registry.
      #
      # Two reasons, and the second is ours rather than npm's advice. A
      # compromised workflow — or a compromised dependency in the build — can
      # stage something and cannot ship it to everyone running `npm i`. And the
      # ordering problem below stops being able to bite: staging four packages
      # and approving them together means a failure part-way leaves the
      # registry untouched, where publishing directly left `rsc-kit` resolving
      # to versions that did not exist.
      #
      # Order is still kept, because approval follows the order things were
      # staged in and the same reasoning applies to it.
      - name: Stage @rsc-kit/core
        working-directory: packages/core
        run: npm stage publish --access public

      - name: Stage create-rsc-kit
        working-directory: packages/create
        run: npm stage publish --access public

      # Standalone: it reads a json file the build writes and depends on nothing
      # else here, so its place in the order is free. Last, so a failure in it
      # cannot leave the three that do depend on each other half-published.
      - name: Stage @rsc-kit/mcp
        working-directory: packages/mcp
        run: npm stage publish --access public

      - name: Stage rsc-kit
        working-directory: packages/cli
        run: npm stage publish --access public

      # Nothing above made anything live. Staging defers the publish to a human
      # with 2FA, so the old check here — poll the registry until the version
      # resolves — would now wait five minutes and then fail every release.
      #
      # What is worth confirming instead is that all four were staged. Three of
      # four is the state that matters: `rsc-kit` pins the other two, so
      # approving a partial set puts a CLI on the registry resolving to versions
      # nobody can install. Better to find that here than at approval time.
      - name: Confirm all four were staged, and say how to ship them
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          STAGED=$(npm stage list --no-workspaces 2>/dev/null || true)
          MISSING=""

          for pkg in @rsc-kit/core create-rsc-kit @rsc-kit/mcp rsc-kit; do
            if grep -q "$pkg@$VERSION" <<<"$STAGED"; then
              echo "  staged  $pkg@$VERSION"
            else
              MISSING="$MISSING $pkg"
            fi
          done

          if [ -n "$MISSING" ]; then
            echo "::error::not staged:$MISSING — approve nothing until all four are, or rsc-kit will pin versions that do not exist"
            exit 1
          fi

          echo "::notice::All four staged. Nothing is live yet — approve them to publish:"
          echo "  npm stage list"
          echo "  npm stage approve <id>   # core, create, mcp, then rsc-kit"
