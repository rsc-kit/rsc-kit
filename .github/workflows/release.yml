name: Release

# Merging to main is the release. The version in package.json is what ships,
# so it is decided in a reviewed pull request rather than by whoever runs a
# command — and the job below refuses to publish a version that is already on
# npm, so an ordinary merge that changes no version is a clean no-op instead
# of a permanently red main.
on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  gate:
    name: Should this merge publish?
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.decide.outputs.version }}
      publish: ${{ steps.decide.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/bun-setup
        with:
          install: "false"

      - id: decide
        run: |
          VERSION=$(node scripts/versions.mjs --check)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          PUBLISHED=$(npm view @rsc-kit/core@"$VERSION" version 2>/dev/null || true)
          if [ -n "$PUBLISHED" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::@rsc-kit/core@$VERSION is already published — nothing to release."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Releasing $VERSION"
          fi

  verify:
    name: Verify before publishing
    needs: gate
    if: needs.gate.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/bun-setup

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build the engine
        run: bun run --filter "@rsc-kit/core" build

      - name: Typecheck every package
        run: bun run typecheck

      - name: Engine and client tests
        run: bun test packages/core/tests/js

      - name: Scaffolder tests
        run: bun test packages/create/tests

      # CI already ran this on the pull request. It runs again here because
      # the cost of finding out after publishing is a burnt version number.
      - name: Verify the published shape
        run: bun run verify:package

  publish:
    name: Publish to npm
    needs: [gate, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
    env:
      VERSION: ${{ needs.gate.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/bun-setup

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Build all three
        run: bun run --filter "*" build

      # Order is load-bearing. `rsc-kit` depends on the other two, so
      # publishing it first puts a package on the registry that resolves to
      # versions which do not exist yet — and `bunx rsc-kit init` fails for
      # anyone who tries it in that window.
      - name: Publish @rsc-kit/core
        working-directory: packages/core
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish create-rsc-kit
        working-directory: packages/create
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish rsc-kit
        working-directory: packages/cli
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Tag the commit these tarballs were built from
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "v$VERSION"
          git push origin "v$VERSION"

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v$VERSION" \
            --title "v$VERSION" \
            --generate-notes

      - name: Confirm the registry actually has them
        run: |
          for pkg in @rsc-kit/core create-rsc-kit rsc-kit; do
            for i in $(seq 1 10); do
              GOT=$(npm view "$pkg@$VERSION" version 2>/dev/null || true)
              [ "$GOT" = "$VERSION" ] && break
              sleep 6
            done
            if [ "$GOT" != "$VERSION" ]; then
              echo "::error::$pkg@$VERSION is not resolvable after publishing"
              exit 1
            fi
            echo "  $pkg@$VERSION"
          done
